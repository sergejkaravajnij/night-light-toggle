[package]
name = "night-light-toggle"
version = "0.1.0"
edition = "2024"

[dependencies]
win-nightlight-lib = "=0.2.0"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
